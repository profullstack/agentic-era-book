name: Build book (HTML + PDF + EPUB)

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pandoc 3.11
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Install WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pipx install weasyprint
          weasyprint --version

      - name: Build
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            dist/*.html
            dist/*.pdf
            dist/*.epub
            dist/cover.jpg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/software-engineering-in-the-agentic-era.html
            dist/software-engineering-in-the-agentic-era.pdf
            dist/software-engineering-in-the-agentic-era.epub
            dist/cover.jpg
